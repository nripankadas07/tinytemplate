[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytemplate"
version = "0.1.0"
description = "Zero-dep ${name} template renderer with defaults, dotted paths, and filters."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nripanka Das" }]
requires-python = ">=3.10"
keywords = ["template", "interpolation", "string", "render", "tiny"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nripankadas07/tinytemplate"
Source   = "https://github.com/nripankadas07/tinytemplate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinytemplate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["tinytemplate"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
